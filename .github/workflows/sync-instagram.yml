name: Sync Instagram and deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-instagram.yml"
      - "scripts/sync-instagram.mjs"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Instagram configuration
        id: configuration
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the INSTAGRAM_ACCESS_TOKEN repository secret to enable the daily feed sync."
          fi

      - name: Setup Node
        if: steps.configuration.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Sync latest Instagram posts
        if: steps.configuration.outputs.enabled == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
        run: node scripts/sync-instagram.mjs

      - name: Commit generated feed
        if: steps.configuration.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/instagram.json public/instagram
          if git diff --cached --quiet; then
            echo "Instagram feed is already current."
          else
            git commit -m "Update Instagram feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Pages
        if: steps.configuration.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        if: steps.configuration.outputs.enabled == 'true'
        run: npm ci

      - name: Build with Next.js
        if: steps.configuration.outputs.enabled == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio

      - name: Upload Pages artifact
        if: steps.configuration.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        if: steps.configuration.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
